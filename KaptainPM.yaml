apiVersion: kaptain.org/1.31
kind: docker-build-dockerfile
metadata:
  description: "Build and test toolchain image for the Forestay AWS variant"

spec:
  layers:
    - ghcr.io/kube-kaptain/layer/layer-github-flow-strict:[1.4]
  main:
    docker:
      platform: linux/amd64,linux/arm64
      dockerfile:
        subPathLinuxAmd64: src/docker
        subPathLinuxArm64: src/docker
    hooks:
      postDockerTests: .github/bin/run-tests.bash
  global:
    release:
      versioning:
        maxParts: "2"
